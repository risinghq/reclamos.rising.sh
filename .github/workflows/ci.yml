name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-changes-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      py: ${{ steps.filter.outputs.py }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            py:
              - .github/workflows/ci.yml
              - mise.toml
              - apps/api/**
              - packages/eval/**
              - pyproject.toml
              - uv.lock
              - docker-compose.yml

  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: sudo apt-get update
      - run:
          sudo apt-get install --yes --no-install-recommends poppler-utils
          tesseract-ocr tesseract-ocr-spa
      - run: mise run install
      - run: mise run check

  integration:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-integration-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: sudo apt-get update
      - run:
          sudo apt-get install --yes --no-install-recommends poppler-utils
          tesseract-ocr tesseract-ocr-spa
      - run: mise run install
      - run: mise run test:integration
      - run: mise run test:gate

  deploy:
    needs: [check, integration]
    if: >-
      github.ref_name == 'master' && always() && needs.check.result == 'success'
      && (needs.integration.result == 'success' || needs.integration.result ==
      'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      IMAGE_TAG: ${{ github.sha }}
      HEALTH_URL: https://api.reclamos.rising.sh/health
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stop when this commit is not the tip of master
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tip=$(gh api repos/${{ github.repository }}/branches/master \
            --jq .commit.sha)
          if [ "$GITHUB_SHA" = "$tip" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "tip of master is $tip; its run deploys everything up to it"
          fi
      - name: Decide whether the API must deploy
        id: api
        if: steps.tip.outputs.current == 'true'
        run: |
          deployed=$(curl -sS --max-time 10 "$HEALTH_URL" \
            | jq -r '.commit // empty' || true)
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          if [ -z "$deployed" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "/health reports no commit"
          elif ! git merge-base --is-ancestor "$deployed" "$GITHUB_SHA"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "$deployed is not an ancestor of $GITHUB_SHA"
          elif git diff --name-only "$deployed" "$GITHUB_SHA" \
              | grep -qE '^(apps/api/|packages/eval/|pyproject\.toml$|uv\.lock$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "image paths changed between $deployed and $GITHUB_SHA"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "$deployed already covers $GITHUB_SHA"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.api.outputs.api == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        id: ecr
        if: steps.api.outputs.api == 'true'
      - name: Build and push the image unless it exists
        if: steps.api.outputs.api == 'true'
        env:
          IMAGE:
            ${{ steps.ecr.outputs.registry }}/reclamos/api:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name reclamos/api \
              --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "$IMAGE already in ECR; skipping build and push"
            exit 0
          fi
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Roll the api and worker services
        if: steps.api.outputs.api == 'true'
        env:
          IMAGE:
            ${{ steps.ecr.outputs.registry }}/reclamos/api:${{ github.sha }}
        run: |
          for family in reclamos-api reclamos-worker; do
            aws ecs describe-task-definition \
              --task-definition "$family" --query taskDefinition \
              > taskdef.json
            jq --arg image "$IMAGE" --arg tag "$IMAGE_TAG" '
              .containerDefinitions[0].image = $image
              | .containerDefinitions[0].environment |=
                  (map(select(.name != "COMMIT_SHA"))
                   + [{ name: "COMMIT_SHA", value: $tag }])
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' taskdef.json > new-taskdef.json
            taskdef_arn=$(aws ecs register-task-definition \
              --cli-input-json file://new-taskdef.json \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service \
              --cluster reclamos --service "${family#reclamos-}" \
              --task-definition "$taskdef_arn" \
              --query 'service.serviceName' --output text
          done
          aws ecs wait services-stable --cluster reclamos --services api worker
      - name: Wait until the API serves this commit
        if: steps.api.outputs.api == 'true'
        run: |
          for _ in $(seq 1 60); do
            commit=$(curl -sS --max-time 10 "$HEALTH_URL" \
              | jq -r '.commit // empty' || true)
            if [ "$commit" = "$IMAGE_TAG" ]; then
              echo "API serves $commit"
              exit 0
            fi
            sleep 10
          done
          echo "API did not report commit $IMAGE_TAG within 10 minutes"
          exit 1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        if: steps.tip.outputs.current == 'true'
      - run: bun install --frozen-lockfile
        if: steps.tip.outputs.current == 'true'
      - run: bun run build
        working-directory: apps/web
        if: steps.tip.outputs.current == 'true'
        env:
          VITE_API_URL: https://api.reclamos.rising.sh
      - run: bun x wrangler deploy
        working-directory: apps/web
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
